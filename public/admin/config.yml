# Joshua Mahony — article editor configuration
# STAGING ONLY: Configure secure GitHub OAuth before testing sign-in.
# The CMS writes directly to the development branch until launch.
backend:
  name: github
  repo: joshuamahony/Joshua-Mahony
  branch: feature/articles-cms
  base_url: https://jm-cms-auth.josh-mahony.workers.dev
  auth_endpoint: /auth

site_url: https://joshua-mahony.com
display_url: https://joshua-mahony.com
publish: false
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: articles
    label: Market Commentary
    label_singular: Article
    folder: src/content/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: Headline, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Category, name: category, widget: select, options: ["Macroeconomics", "FX & Currencies", "Commodities", "Equities", "Central Banks", "Market Outlook"] }
      - { label: Summary, name: description, widget: text, hint: "Shown on the homepage, article archive and search results." }
      - { label: Hero image, name: image, widget: image, required: false }
      - { label: Article content, name: body, widget: markdown, hint: "Add headings, paragraphs, links and uploaded chart images." }

  - name: homepage
    label: Homepage
    description: Edit the portfolio homepage without changing code.
    files:
      - label: Homepage Content
        name: homepage
        file: src/data/homepage.json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - {label: Eyebrow, name: eyebrow, widget: string}
              - {label: Name, name: name, widget: string}
              - {label: Professional title, name: role, widget: string}
              - {label: Introduction, name: introduction, widget: text}
              - {label: Headshot, name: headshot, widget: image, required: false, hint: "Leave blank to retain the existing professional headshot."}
          - label: About
            name: about
            widget: object
            fields:
              - {label: Section headline, name: headline, widget: string}
              - {label: First paragraph, name: paragraph1, widget: text}
              - {label: Second paragraph, name: paragraph2, widget: text}
              - label: Expertise
                name: expertise
                widget: list
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Description, name: description, widget: text}
          - label: Professional highlights
            name: stats
            widget: list
            fields:
              - {label: Value, name: value, widget: string}
              - {label: Label, name: label, widget: string}
          - label: Broadcast videos
            name: broadcasts
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Network, name: network, widget: string}
              - {label: Category, name: type, widget: select, options: [broadcast, longform, short]}
              - {label: Date (display text), name: date, widget: string, required: false}
              - {label: Summary, name: summary, widget: text}
              - {label: Video link, name: url, widget: string, hint: "Paste the direct YouTube, X or Instagram URL."}
              - {label: Thumbnail image, name: thumbnail, widget: image, required: false}
          - label: Services
            name: services
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: Email subject, name: subject, widget: string}
          - label: Contact
            name: contact
            widget: object
            fields:
              - {label: Headline, name: headline, widget: string}
              - {label: Description, name: description, widget: text}
              - {label: Email, name: email, widget: string}
              - {label: LinkedIn URL, name: linkedin, widget: string}
              - {label: X URL, name: x, widget: string}
              - {label: YouTube URL, name: youtube, widget: string}
