name: Validate Astro website
on:
  push:
    branches: [feature/articles-cms]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Verify generated pages
        run: |
          test -f dist/index.html
          test -f dist/commentary/index.html
          test -f dist/admin/index.html
          grep -q 'Browse the complete commentary archive' dist/index.html
