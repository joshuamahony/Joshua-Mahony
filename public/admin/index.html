<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Joshua Mahony | Article Editor</title>
</head>
<body>
  <!-- Decap CMS loads the editor UI here. GitHub login needs a secure OAuth bridge before publishing. -->
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
  /*
   * Custom Decap CMS widget: suggests an article URL slug from the headline,
   * using Decap's entry data instead of relying on DOM event listeners,\n   * while preserving any manual edits. The slug is only used to name a NEW article.
   * Existing article filenames/URLs are intentionally not renamed.
   */
  (function () {
    if (!window.CMS || !window.createClass || !window.h) return;

    function slugify(text) {
      var full = String(text || '')
        .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[’']s\b/g, '').replace(/[’']/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '').replace(/-+/g, '-');

      // Keep ordinary headlines intact. Shorten only long, unwieldy URLs.
      var words = full ? full.split('-') : [];
      if (full.length <= 65 && words.length <= 9) return full;

      // Keep negations ("not", "no", "without") and all numbers.
      // This is a conservative suggestion, not an AI summary.
      var filler = new Set([
        'a', 'an', 'the', 'and', 'or', 'but', 'as', 'at', 'by', 'for',
        'from', 'in', 'into', 'of', 'on', 'onto', 'to', 'with',
        'is', 'are', 'was', 'were', 'be', 'been', 'being',
        'this', 'that', 'these', 'those', 'it', 'its',
        'could', 'would', 'should', 'might', 'may', 'can',
        'actually', 'really', 'just', 'very', 'why', 'how',
        'what', 'when', 'where', 'setting', 'up'
      ]);
      var important = words.filter(function (word) { return !filler.has(word); });
      if (important.length < 3) important = words;

      var selected = [];
      for (var i = 0; i < important.length && selected.length < 7; i++) {
        var trial = selected.concat(important[i]).join('-');
        if (trial.length > 60 && selected.length >= 3) break;
        selected.push(important[i]);
      }
      return selected.join('-') || full;
    }
    function headlineInput() {
      var labels = Array.from(document.querySelectorAll('label'));
      for (var i = 0; i < labels.length; i++) {
        if (labels[i].textContent.trim() !== 'Headline') continue;
        if (labels[i].control && labels[i].control.tagName === 'INPUT') return labels[i].control;
        if (labels[i].htmlFor) {
          var matched = document.getElementById(labels[i].htmlFor);
          if (matched && matched.tagName === 'INPUT') return matched;
        }
        var parent = labels[i].parentElement;
        for (var n = 0; n < 4 && parent; n++, parent = parent.parentElement) {
          var field = parent.querySelector('input[type="text"], input:not([type])');
          if (field) return field;
        }
      }
      return document.querySelector('input[id*="title"], input[name="title"]');
    }

    var AutoSlugControl = createClass({
      componentDidMount: function () {
        this.lastSuggested = '';
        this.manuallyEdited = false;
        this.previousTitle = this.getHeadline();
        // An existing article may already have an intentional URL; don't rewrite it.
        if (!this.props.value && this.previousTitle) {
          this.suggestFromHeadline(this.previousTitle);
        }
      },
      componentDidUpdate: function () {
        // Decap passes the complete editor entry to custom widget controls.
        // React updates this widget whenever the headline changes.
        var title = this.getHeadline();
        if (title !== this.previousTitle) {
          this.previousTitle = title;
          this.suggestFromHeadline(title);
        }
      },
      getHeadline: function () {
        var entry = this.props.entry;
        return entry && typeof entry.getIn === 'function'
          ? String(entry.getIn(['data', 'title']) || '')
          : '';
      },
      suggestFromHeadline: function (title) {
        var suggestion = slugify(title);
        var current = String(this.props.value || '');
        // Also replace an earlier unshortened automatic suggestion,
        // while preserving manually entered slugs and existing article URLs.
        var full = String(title || '').normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().replace(/[’']s\b/g, '').replace(/[’']/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        if (!this.manuallyEdited &&
            (!current || current === this.lastSuggested || current === full)) {
          if (current !== suggestion) this.props.onChange(suggestion);
        }
        this.lastSuggested = suggestion;
      },
      onSlugChange: function (event) {
        this.manuallyEdited = true;
        this.props.onChange(event.target.value);
      },
      render: function () {
        return h('input', {
          id: this.props.forID,
          className: this.props.classNameWrapper,
          type: 'text',
          autoComplete: 'off',
          value: this.props.value || '',
          placeholder: 'Automatically generated from headline',
          onChange: this.onSlugChange,
          'aria-label': 'URL Slug'
        });
      }
    });
    CMS.registerWidget('auto_slug', AutoSlugControl);
  }());
</script>
</body>
</html>
